[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "productif-ops-bot"
version = "0.1.0"
description = "Telegram bot for productif.io daily ops."
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4",
  "python-dotenv>=1,<2",
  "python-telegram-bot>=21,<23",
]

[project.scripts]
productif-ops-bot = "productif_ops_bot.main:main"
productif-ops-import-plan = "productif_ops_bot.import_plan:main"
productif-ops-api = "productif_ops_bot.api:main"
productif-ops-token = "productif_ops_bot.token_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
